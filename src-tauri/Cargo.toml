[package]
name = "hellas-gate"
description = "The native desktop host for Hellas"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:ts-rs"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "hellas-gate"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
getrandom = "0.4"
hex = "0.4"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
zeroize = "1"
base64 = "0.22"
futures = "0.3"
hellas-auth = { git = "https://github.com/hellas-ai/hellas", rev = "3932c4cca96b07f0517b18ecb66153b75964b381" }
hellas-providers = { git = "https://github.com/hellas-ai/hellas", rev = "3932c4cca96b07f0517b18ecb66153b75964b381" }
hellas-attestation = { git = "https://github.com/hellas-ai/hellas", rev = "3932c4cca96b07f0517b18ecb66153b75964b381", features = ["apple-app-attest"] }
hellas-gateway = { git = "https://github.com/hellas-ai/hellas", rev = "3932c4cca96b07f0517b18ecb66153b75964b381" }
hellas-private = { git = "https://github.com/hellas-ai/hellas", rev = "3932c4cca96b07f0517b18ecb66153b75964b381" }
hellas-rpc = { git = "https://github.com/hellas-ai/hellas", rev = "3932c4cca96b07f0517b18ecb66153b75964b381", features = ["host-control", "execute", "fetch", "work"] }
hellas-sdk = { git = "https://github.com/hellas-ai/hellas", rev = "3932c4cca96b07f0517b18ecb66153b75964b381", default-features = false }
hellas-wire = { git = "https://github.com/hellas-ai/hellas", rev = "3932c4cca96b07f0517b18ecb66153b75964b381", features = ["unix"] }
libc = "0.2"
# The same bundled SQLite that hellas's Work journals compile in; history.rs
# drives it through the C API.
libsqlite3-sys = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"], optional = true }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "fs", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "12", features = ["serde-compat"], optional = true }

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"
