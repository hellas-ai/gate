[package]
name = "hellas-gate"
description = "The native desktop host for Hellas"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["desktop"]
chain-tests = ["hellas-chain/test-support"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:ts-rs"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "hellas-gate"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
hellas-webauthn = { git = "https://github.com/hellas-ai/hellas", rev = "051813aa183f9d222d99371a106eae8c751e9610", features = ["der"] }
ciborium = "0.2"
sha2 = "0.11"
hellas-chain = { git = "https://github.com/hellas-ai/hellas", rev = "051813aa183f9d222d99371a106eae8c751e9610" }
hellas-authority = { git = "https://github.com/hellas-ai/hellas", rev = "051813aa183f9d222d99371a106eae8c751e9610" }
hellas-channel = { git = "https://github.com/hellas-ai/hellas", rev = "051813aa183f9d222d99371a106eae8c751e9610" }
hellas-executor = { git = "https://github.com/hellas-ai/hellas", rev = "051813aa183f9d222d99371a106eae8c751e9610", default-features = false }
anyhow = "1"
async-trait = "0.1"
getrandom = "0.4"
hex = "0.4"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
zeroize = "1"
base64 = "0.23"
futures = "0.3"
hellas-genesis = { git = "https://github.com/hellas-ai/hellas", rev = "051813aa183f9d222d99371a106eae8c751e9610" }
hellas-auth = { git = "https://github.com/hellas-ai/hellas", rev = "051813aa183f9d222d99371a106eae8c751e9610" }
hellas-adaptors = { git = "https://github.com/hellas-ai/hellas", rev = "051813aa183f9d222d99371a106eae8c751e9610" }
hellas-store = { git = "https://github.com/hellas-ai/hellas", rev = "051813aa183f9d222d99371a106eae8c751e9610" }
hellas-share = { git = "https://github.com/hellas-ai/hellas", rev = "051813aa183f9d222d99371a106eae8c751e9610" }
hellas-attestation = { git = "https://github.com/hellas-ai/hellas", rev = "051813aa183f9d222d99371a106eae8c751e9610", features = ["apple-app-attest"] }
hellas-gateway = { git = "https://github.com/hellas-ai/hellas", rev = "051813aa183f9d222d99371a106eae8c751e9610" }
hellas-private = { git = "https://github.com/hellas-ai/hellas", rev = "051813aa183f9d222d99371a106eae8c751e9610" }
hellas-rpc = { git = "https://github.com/hellas-ai/hellas", rev = "051813aa183f9d222d99371a106eae8c751e9610", features = ["host-control", "execute", "fetch", "work"] }
hellas-sdk = { git = "https://github.com/hellas-ai/hellas", rev = "051813aa183f9d222d99371a106eae8c751e9610", default-features = false }
hellas-wire = { git = "https://github.com/hellas-ai/hellas", rev = "051813aa183f9d222d99371a106eae8c751e9610", features = ["unix"] }
# The same bundled SQLite that hellas's Work journals compile in; history.rs
# drives it through the C API.
libsqlite3-sys = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"], optional = true }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "fs", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "12", features = ["serde-compat"], optional = true }

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[dev-dependencies]
p256 = { version = "0.14", features = ["ecdsa"] }
tempfile = "3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
commonware-runtime = { git = "https://github.com/georgewhewell/commonware-monorepo", rev = "36fabc5cd7bad6675ab83b6784a2912cc80d94f1" }
